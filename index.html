<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>最后一张 · 倒数 MV</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<div id="start">
  <div class="s-card">
    <div class="s-photo"><div class="s-count">10</div></div>
    <div class="s-margin">
      <div class="s-title">最后一张</div>
      <div class="s-song" id="songLine">倒数 · MV</div>
    </div>
  </div>
  <div class="s-status" id="status">正在装相纸…</div>
  <div class="s-buttons">
    <button id="btnFull" disabled>▶ 全屏放映</button>
    <button id="btnWin" class="ghost" disabled>窗口播放</button>
  </div>
  <label class="s-file" id="fileWrap" hidden>没找到 assets/song.mp3？<input type="file" id="file" accept="audio/*"> 手动选择音频</label>
  <div class="s-hint">空格 暂停 · F 全屏 · ← → 快退快进 5 秒 · 1～5 跳到各段 · D 显示镜号</div>
</div>

<div id="hud">
  <div id="bar"><div id="played"></div><div id="marks"></div></div>
  <div class="row">
    <button id="btnPlay" class="icon">❚❚</button>
    <span id="time">0:00 / 3:49</span>
    <span id="chapter"></span>
    <span class="spacer"></span>
    <button id="btnFs" class="icon">⛶</button>
  </div>
</div>
<div id="debug" hidden></div>

<script src="js/audio-data.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/look.js"></script>
<script src="js/art-list.js"></script>
<script src="js/art.js"></script>
<script src="js/fx.js"></script>
<script src="js/instax.js"></script>
<script src="js/lrc.js"></script>
<script src="js/lyric-timing.js"></script>
<script src="js/type.js"></script>
<script src="js/director.js"></script>
<script src="js/shots-1.js"></script>
<script src="js/shots-2.js"></script>
<script src="js/shots-3.js"></script>
<script src="js/shots-4.js"></script>
<script src="js/app.js"></script>
</body>
</html>
